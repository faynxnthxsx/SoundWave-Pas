services:
  # 1. MySQL 8.0 Database Service
  db:
    image: mysql:8.0
    container_name: soundwave-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-soundwave_db}
      TZ: Asia/Bangkok
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # 2. Express + Prisma Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soundwave-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@db:3306/${MYSQL_DATABASE:-soundwave_db}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      SEED_ORGANIZER_PASSWORD: ${SEED_ORGANIZER_PASSWORD:-1234}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Bangkok
    ports:
      - "5000:5000"
      - "5555:5555"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/prisma:/app/prisma

  # 3. React + Nginx Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soundwave-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
