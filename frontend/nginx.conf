server {
    listen 80;
    server_name localhost;

    # Allow poster uploads up to 10MB
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API calls to Backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy uploaded poster images to Backend container
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve React Single Page Application (SPA fallback for BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
