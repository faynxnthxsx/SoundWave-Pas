<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SoundWave Pass" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SoundWave Pass | ระบบจองตั๋วคอนเสิร์ต & เทศกาลดนตรีร็อกและอินดี้</title>
    <!-- Prompt Font for Thai language -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('soundwave_theme');
          if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="font-family: 'Prompt', system-ui, sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
