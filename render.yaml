services:
  - type: web
    name: soundwave-pass-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    disk:
      name: soundwave-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/soundwave.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PUBLIC_APP_URL
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_SECRET
        sync: false
      - key: LINE_LOGIN_CALLBACK_URL
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: SEED_SUPERVISOR_PASSWORD
        sync: false
      - key: SEED_GATE_PASSWORD
        sync: false
      - key: SEED_ORGANIZER_PASSWORD
        sync: false
